[project]
name = "three-rewards-env"
version = "0.1.0"
description = "Truthfulness, scope and abstention rewards for agentic coding under rising task pressure (verifiers environment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Szabolcs Kuki" }]
dependencies = [
    "verifiers>=0.2",
]

[project.urls]
Repository = "https://github.com/knews2019/ai-alignment-three-rewards-env"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["three_rewards_env/**"]
